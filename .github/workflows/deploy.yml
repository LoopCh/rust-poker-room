name: CI & Auto-Deploy to VPS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rust-poker-room
  TARGET: x86_64-unknown-linux-musl

jobs:
  test-and-build:
    name: Test & Build Static Linux Binary
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools for static linking
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Run unit & stability tests
        run: cargo test --verbose

      - name: Build optimized static release binary
        run: cargo build --release --target ${{ env.TARGET }}

      - name: Check binary size
        run: ls -lh target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-musl
          path: target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}
          retention-days: 7

      - name: Deploy to VPS over SSH
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "⚠️ Секреты VPS_HOST, VPS_USER или VPS_SSH_KEY еще не заданы в GitHub Settings -> Secrets."
            echo "✅ Бинарник успешно собран и протестирован (доступен во вкладке Artifacts)."
            exit 0
          fi

          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          echo "🚀 Загрузка статического бинарника на VPS ($VPS_USER@$VPS_HOST:$PORT)..."
          scp -i ~/.ssh/id_deploy -P "$PORT" \
            target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }} \
            "$VPS_USER@$VPS_HOST:/tmp/${{ env.BINARY_NAME }}.new"

          echo "🔄 Атомарное обновление, проверка TURN (coturn) и перезапуск сервиса rust-poker..."
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$VPS_USER@$VPS_HOST" "
            if ! grep -q 'rustholdem_turn_2026' /etc/turnserver.conf 2>/dev/null; then
              echo '📡 Установка и авто-настройка TURN-ретранслятора coturn (порт 3478)...'
              sudo apt-get update -y && sudo apt-get install -y coturn
              sudo sed -i 's/^#*TURNSERVER_ENABLED=.*/TURNSERVER_ENABLED=1/' /etc/default/coturn 2>/dev/null || echo 'TURNSERVER_ENABLED=1' | sudo tee /etc/default/coturn >/dev/null
              PUB_IP=\$(curl -s4 ifconfig.me || hostname -I | awk '{print \$1}')
              printf '%s\n' \
                'listening-port=3478' \
                'fingerprint' \
                'lt-cred-mech' \
                'user=poker:rustholdem_turn_2026' \
                'realm=poker.vikhr.online' \
                \"external-ip=\$PUB_IP\" \
                'min-port=49152' \
                'max-port=49252' \
                'max-bps=250000' \
                'no-multicast-peers' \
                'no-loopback-peers' \
                'no-cli' \
                'no-tlsv1' \
                'no-tlsv1_1' \
                'denied-peer-ip=10.0.0.0-10.255.255.255' \
                'denied-peer-ip=192.168.0.0-192.168.255.255' \
                'denied-peer-ip=172.16.0.0-172.31.255.255' \
                | sudo tee /etc/turnserver.conf >/dev/null
              sudo systemctl enable coturn
              sudo systemctl restart coturn
              if command -v ufw >/dev/null 2>&1 && sudo ufw status | grep -q 'Status: active'; then
                sudo ufw allow 3478/tcp
                sudo ufw allow 3478/udp
                sudo ufw allow 49152:49252/udp
              fi
              echo '✅ TURN-сервер coturn успешно настроен и запущен!'
            fi &&
            chmod +x /tmp/${{ env.BINARY_NAME }}.new &&
            sudo mv /tmp/${{ env.BINARY_NAME }}.new /usr/local/bin/${{ env.BINARY_NAME }} &&
            sudo systemctl restart rust-poker &&
            sudo systemctl is-active --quiet rust-poker &&
            echo '✅ Сервис rust-poker успешно обновлен и запущен!'
          "
